spring.application.name=CrisisConnect
server.port=8080

# H2 (in-memory) datasource - use for local development
spring.datasource.url=jdbc:h2:mem:crisisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 console for easy local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Using 'update' so the app can start locally even without Flyway migrations present
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway - database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.crisisConnect=DEBUG
